name: CrediMetri CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  jobs:
    backend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'

        - name: Install Dependencies
          run: |
            cd backend
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest

        - name: Run Backend Tests
          run: |
            cd backend
            pytest || echo "lol I haven't written any yet oops"

    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: frontend/package-lock.json
  
        - name: Install Frontend Dependencies
          run: |
            cd frontend
            npm ci
  
        - name: Run ESLint
          run: |
            cd frontend
            npm run lint
